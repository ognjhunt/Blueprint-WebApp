services:
  - type: web
    name: Blueprint-WebApp
    runtime: node
    # Free instances sleep when idle, which stops the in-process customer
    # outbox pump and the beta ops monitor (intake notice retries, outbox
    # failure alerts) and cold-starts the first visitor. Starter stays up.
    plan: starter
    region: virginia
    # Deploys are CI-gated: .github/workflows/deploy.yml triggers the Render
    # deploy hook only for an exact commit whose CI run is green on main.
    # Keeping Render-native auto-deploy off means a red or unreviewed push can
    # never ship, and there is exactly one deploy owner (the workflow).
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Liveness only. /health/ready reports launch readiness (provider config,
    # beta caps, Redis, Slack, Resend) and can legitimately be 503 while the
    # process serves traffic; Render must not cycle a live instance for that.
    # Readiness is verified after every deploy by .github/workflows/deploy.yml
    # and alerted by the in-process monitor and the uptime workflow.
    healthCheckPath: /health

  # Dedicated production launch-forward worker. This deployment is explicitly
  # constrained to Task Evaluation launch reconciliation; unrelated ops and
  # Stripe queue processors stay off in this service.
  #
  # Env vars are dashboard-managed. The worker needs Firebase Admin plus the
  # canonical Pipeline forward URL/token and launch-forward controls.
  - type: worker
    name: blueprint-webapp-worker
    runtime: node
    plan: starter
    region: virginia
    autoDeploy: false
    buildCommand: npm ci && npm run build
    # Avoid a persistent npm launcher competing with this 512 MiB worker's
    # independently admitted research Python/Firestore subprocesses.
    startCommand: NODE_ENV=production node dist/worker.js
    envVars:
      # This service shares the web build command but starts dist/worker.js and
      # never serves the client bundle, so it carries only the Firebase Admin
      # credentials, not the VITE_FIREBASE_* client config. Without this the
      # client-env build guard would fail a worker deploy for config the worker
      # is deliberately not given. The web service has no such exemption.
      - key: BLUEPRINT_ALLOW_UNCONFIGURED_CLIENT_BUILD
        value: "1"
      - key: BLUEPRINT_TASK_EVALUATION_LAUNCH_FORWARD_ONLY_WORKER
        value: "true"
      - key: BLUEPRINT_COMPANY_POLICY_OUTBOX_WORKER_ENABLED
        value: "true"
      - key: BLUEPRINT_DAILY_RESEARCH_PACKAGE_BUILD
        value: "true"
      - key: BLUEPRINT_DAILY_RESEARCH_WORKER_ENABLED
        value: "false"
