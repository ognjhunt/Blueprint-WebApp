name: Deploy (Render, CI-gated)

# Single deploy owner for Blueprint-WebApp and blueprint-webapp-worker:
# render.yaml keeps Render-native auto-deploy OFF, and this workflow is the
# only path to production for both exact-SHA identities.
#
# Guarantees:
#   * Only an exact commit whose CI workflow concluded `success` on main can
#     deploy (workflow_run trigger + conclusion check + exact head SHA pin).
#   * Missing deploy configuration fails CLOSED: no API key or service ID
#     means the job errors loudly instead of silently skipping or falling back.
#   * The deployed SHA is observable at GET /version.json (written by
#     scripts/generate-build-info.mjs during the build).
#   * Rollback is revert-commit based (scripts/deploy-rollback.mjs) and rides
#     the same green-CI gate; history is never rewritten.
#
# One-time dashboard steps (documented in docs/runbooks/ci-gated-deploy-2026-07-16.md):
#   1. Store a Render API key as the RENDER_API_KEY Actions secret.
#   2. Store the web and worker service IDs as the RENDER_SERVICE_ID and
#      RENDER_WORKER_SERVICE_ID Actions variables.
#   3. Confirm Auto-Deploy is off after this workflow is proven operational.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact git SHA to deploy on Render (operator-initiated redeploy/rollforward)."
        required: true
        type: string
      clear_cache:
        description: >-
          Clear Render's build cache before deploying. Needed when a failed
          clone left a partially-populated /opt/render/project/src behind:
          Render then retries into a non-empty directory and every attempt
          fails with "destination path already exists" regardless of what the
          commit contains. Off by default because clearing the cache makes the
          build materially slower.
        required: false
        default: false
        type: boolean

concurrency:
  group: render-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger CI-gated Render deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve and verify deploy ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.inputs.ref }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual dispatch rides the same green-exact-commit gate as the
            # automatic path: resolve to a SHA, require it to be on main, and
            # require a successful CI run for that exact commit. Otherwise any
            # dispatcher could ship an arbitrary or red SHA.
            deploy_ref=$(gh api "repos/${REPO}/commits/${DISPATCH_REF}" --jq .sha)
            ancestry=$(gh api "repos/${REPO}/compare/${deploy_ref}...main" --jq .status)
            if [ "${ancestry}" != "identical" ] && [ "${ancestry}" != "ahead" ]; then
              echo "::error::${deploy_ref} is not an ancestor of main (compare status: ${ancestry}). Refusing to deploy."
              exit 1
            fi
            green_runs=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${deploy_ref}&status=completed" \
              --jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
            if [ "${green_runs}" -eq 0 ]; then
              echo "::error::No successful CI run exists for ${deploy_ref}. Refusing to deploy a commit CI has not proven green."
              exit 1
            fi
          else
            deploy_ref="${WORKFLOW_RUN_SHA}"
          fi
          if [ -z "${deploy_ref}" ]; then
            echo "::error::Could not resolve a git SHA to deploy."
            exit 1
          fi
          echo "deploy_ref=${deploy_ref}" >> "${GITHUB_OUTPUT}"
          echo "Deploying exact ref ${deploy_ref}"

      - name: Trigger exact-SHA Render deploy through API (fail-closed)
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
          DEPLOY_REF: ${{ steps.ref.outputs.deploy_ref }}
          CLEAR_CACHE: ${{ github.event.inputs.clear_cache }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY secret is not set. Deploys fail closed. See docs/runbooks/ci-gated-deploy-2026-07-16.md."
            exit 1
          fi
          for service_var in RENDER_SERVICE_ID RENDER_WORKER_SERVICE_ID; do
            service_id="${!service_var:-}"
            case "${service_id}" in
              srv-*) ;;
              *)
                echo "::error::${service_var} Actions variable is missing or invalid."
                exit 1
                ;;
            esac
          done
          # Only an explicit workflow_dispatch opt-in clears the cache; the
          # automatic post-CI path keeps the fast default.
          if [ "${CLEAR_CACHE:-false}" = "true" ]; then
            clear_cache_value="clear"
          else
            clear_cache_value="do_not_clear"
          fi
          echo "Render build cache: ${clear_cache_value}"
          payload=$(printf '{"commitId":"%s","clearCache":"%s"}' "${DEPLOY_REF}" "${clear_cache_value}")
          trigger_deploy() {
            service_id="$1"
            label="$2"
            response_path="/tmp/render-${label}-deploy-response.json"
            response_code=$(curl -s -o "${response_path}" -w "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "https://api.render.com/v1/services/${service_id}/deploys")
            echo "Render ${label} deploy API responded ${response_code}"
            if [ "${response_code}" -lt 200 ] || [ "${response_code}" -ge 300 ]; then
              echo "::error::Render ${label} deploy API returned HTTP ${response_code}."
              cat "${response_path}" || true
              exit 1
            fi
            # Render normally returns the deploy JSON with HTTP 201. When an
            # exact-SHA deploy is already being started (for example immediately
            # after a worker resume), it can return HTTP 202 with an empty body.
            # Resolve that accepted request from the service deploy list instead
            # of treating valid empty JSON as a failed mutation.
            TRIGGERED_DEPLOY_ID=$(node -e '
              const fs = require("node:fs");
              const body = fs.readFileSync(process.argv[1], "utf8").trim();
              if (!body) process.exit(0);
              const response = JSON.parse(body);
              if (typeof response.id !== "string" || !response.id.startsWith("dep-")) process.exit(1);
              process.stdout.write(response.id);
            ' "${response_path}" 2>/dev/null || true)
            if [ -z "${TRIGGERED_DEPLOY_ID}" ]; then
              list_path="/tmp/render-${label}-deploy-list.json"
              for attempt in $(seq 1 10); do
                list_code=$(curl -s -o "${list_path}" -w "%{http_code}" \
                  --max-time 20 \
                  --header "Authorization: Bearer ${RENDER_API_KEY}" \
                  "https://api.render.com/v1/services/${service_id}/deploys?limit=20")
                if [ "${list_code}" = "200" ]; then
                  TRIGGERED_DEPLOY_ID=$(node -e '
                    const fs = require("node:fs");
                    const expectedCommit = process.argv[2];
                    const activeStatuses = new Set([
                      "created",
                      "build_in_progress",
                      "pre_deploy_in_progress",
                      "update_in_progress",
                      "live",
                    ]);
                    const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                    const deploys = Array.isArray(response)
                      ? response.map((entry) => entry?.deploy ?? entry)
                      : [];
                    const match = deploys.find((deploy) =>
                      typeof deploy?.id === "string" &&
                      deploy.id.startsWith("dep-") &&
                      deploy?.commit?.id === expectedCommit &&
                      activeStatuses.has(deploy?.status)
                    );
                    if (match) process.stdout.write(match.id);
                  ' "${list_path}" "${DEPLOY_REF}")
                fi
                if [ -n "${TRIGGERED_DEPLOY_ID}" ]; then
                  echo "Resolved accepted ${label} deploy ${TRIGGERED_DEPLOY_ID} from the Render deploy list."
                  break
                fi
                echo "Accepted ${label} deploy is not listed yet (attempt ${attempt}/10)."
                sleep 3
              done
            fi
            if [ -z "${TRIGGERED_DEPLOY_ID}" ]; then
              echo "::error::Render accepted the ${label} request but no active exact-SHA deploy could be resolved."
              exit 1
            fi
            echo "Render accepted ${label} deploy ${TRIGGERED_DEPLOY_ID} for ${DEPLOY_REF}."
          }
          trigger_deploy "${RENDER_SERVICE_ID}" web
          web_deploy_id="${TRIGGERED_DEPLOY_ID}"
          trigger_deploy "${RENDER_WORKER_SERVICE_ID}" worker
          worker_deploy_id="${TRIGGERED_DEPLOY_ID}"
          echo "web_deploy_id=${web_deploy_id}" >> "${GITHUB_OUTPUT}"
          echo "worker_deploy_id=${worker_deploy_id}" >> "${GITHUB_OUTPUT}"
          echo "API acceptance is NOT deployment success; both exact-SHA deploy records are verified below."

      - name: Verify deployment completed at the exact SHA
        env:
          DEPLOY_REF: ${{ steps.ref.outputs.deploy_ref }}
          RENDER_WEB_DEPLOY_ID: ${{ steps.render.outputs.web_deploy_id }}
          RENDER_WORKER_DEPLOY_ID: ${{ steps.render.outputs.worker_deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
          BASE_URL: https://tryblueprint.io
        run: |
          set -euo pipefail
          mkdir -p /tmp/deploy-evidence
          evidence=/tmp/deploy-evidence/deploy-verification.json
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Poll both Render deploy records so the web and independent worker
          # must become live at the same exact commit before production is
          # called deployed.
          wait_for_deploy() {
            label="$1"
            service_id="$2"
            deploy_id="$3"
            response_path="/tmp/deploy-evidence/render-${label}-deploy.json"
            DEPLOY_STATUS=""
            DEPLOY_COMMIT=""
            for attempt in $(seq 1 80); do
              if ! response_code=$(curl -s -o "${response_path}" -w "%{http_code}" \
                --max-time 20 \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${service_id}/deploys/${deploy_id}"); then
                response_code=000
              fi
              if [ "${response_code}" = "200" ]; then
                deploy_fields=$(node -e '
                  const fs = require("node:fs");
                  const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  const status = typeof response.status === "string" ? response.status : "";
                  const commit = typeof response.commit?.id === "string" ? response.commit.id : "";
                  process.stdout.write(`${status}\t${commit}`);
                ' "${response_path}")
                IFS=$'\t' read -r DEPLOY_STATUS DEPLOY_COMMIT <<< "${deploy_fields}"
              fi
              case "${DEPLOY_STATUS}" in
                live) break ;;
                build_failed|update_failed|canceled|deactivated)
                  echo "::error::Render ${label} deploy ${deploy_id} ended with status ${DEPLOY_STATUS}."
                  exit 1
                  ;;
              esac
              echo "${label} attempt ${attempt}/80: status='${DEPLOY_STATUS:-unreachable}'. Waiting 15s."
              sleep 15
            done
            if [ "${DEPLOY_STATUS}" != "live" ]; then
              echo "::error::Render ${label} deploy ${deploy_id} did not become live after 20 minutes."
              exit 1
            fi
            if [ "${DEPLOY_COMMIT}" != "${DEPLOY_REF}" ]; then
              echo "::error::Render ${label} deploy is live at '${DEPLOY_COMMIT:-unknown}', expected ${DEPLOY_REF}."
              exit 1
            fi
          }
          wait_for_deploy web "${RENDER_SERVICE_ID}" "${RENDER_WEB_DEPLOY_ID}"
          web_deploy_status="${DEPLOY_STATUS}"
          web_deploy_commit="${DEPLOY_COMMIT}"
          wait_for_deploy worker "${RENDER_WORKER_SERVICE_ID}" "${RENDER_WORKER_DEPLOY_ID}"
          worker_deploy_status="${DEPLOY_STATUS}"
          worker_deploy_commit="${DEPLOY_COMMIT}"

          # Poll GET /version.json until the exact requested SHA is serving
          # traffic. Timeout: 20 minutes.
          deployed_sha=""
          for attempt in $(seq 1 40); do
            deployed_sha=$(curl -sf --max-time 20 "${BASE_URL}/version.json" | { grep -o '"git_sha"[^,}]*' || true; } | { grep -o '[0-9a-f]\{40\}' || true; })
            if [ "${deployed_sha}" = "${DEPLOY_REF}" ]; then
              break
            fi
            echo "Attempt ${attempt}/40: live git_sha='${deployed_sha:-unreachable}' != '${DEPLOY_REF}'. Waiting 30s."
            sleep 30
          done
          if [ "${deployed_sha}" != "${DEPLOY_REF}" ]; then
            echo "::error::Deployment did not converge: live /version.json still reports '${deployed_sha:-unreachable}' after 20 minutes, expected ${DEPLOY_REF}."
            exit 1
          fi
          echo "Live /version.json reports the exact requested SHA ${DEPLOY_REF}."

          # Liveness and readiness are verified separately: /health proves the
          # process serves traffic; /health/ready reports launch readiness and
          # is recorded truthfully (its verdict is evidence, and a not-ready
          # verdict fails this gate because the service is not beta-servable).
          health_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${BASE_URL}/health")
          ready_code=$(curl -s -o /tmp/deploy-evidence/health-ready-body.json -w "%{http_code}" --max-time 20 "${BASE_URL}/health/ready")
          finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"web_render_deploy_id":"%s","web_render_deploy_status":"%s","web_render_commit":"%s","worker_render_deploy_id":"%s","worker_render_deploy_status":"%s","worker_render_commit":"%s","deploy_ref":"%s","live_git_sha":"%s","health_status":%s,"health_ready_status":%s,"started_at":"%s","finished_at":"%s"}\n' \
            "${RENDER_WEB_DEPLOY_ID}" "${web_deploy_status}" "${web_deploy_commit}" "${RENDER_WORKER_DEPLOY_ID}" "${worker_deploy_status}" "${worker_deploy_commit}" "${DEPLOY_REF}" "${deployed_sha}" "${health_code}" "${ready_code}" "${started_at}" "${finished_at}" > "${evidence}"
          cat "${evidence}"
          if [ "${health_code}" != "200" ]; then
            echo "::error::GET /health returned ${health_code}; expected 200."
            exit 1
          fi
          if [ "${ready_code}" != "200" ]; then
            echo "::error::GET /health/ready returned ${ready_code}; the deployed commit is live but the service is not launch-ready."
            exit 1
          fi

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-verification
          path: /tmp/deploy-evidence
          if-no-files-found: ignore
