name: CI

# Push runs cover main (the deploy gate source); pull_request runs cover PR
# heads. Restricting push to main avoids the duplicate push+PR run every PR
# head used to get, without weakening main verification.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref, but never cancel a main run —
# the CI-gated deploy workflow keys off completed main runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release/checks.mjs scope

  # Validation commands gate CI; diagnostic artifact uploads are optional
  # because GitHub can reject them when the repository storage quota is full.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout BlueprintCapture rules parity source
        uses: actions/checkout@v4
        with:
          repository: ognjhunt/BlueprintCapture
          # Pin the ref: parity always compares against BlueprintCapture main,
          # and an explicit ref skips checkout's default-branch API lookup —
          # the call that flaked with GitHub 503s on 2026-07-16.
          ref: main
          path: BlueprintCapture
          ssh-key: ${{ secrets.BLUEPRINT_CAPTURE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Checkout BlueprintContracts for shared robot-eval contract
        uses: actions/checkout@v4
        with:
          repository: ognjhunt/BlueprintContracts
          # Keep this aligned with BlueprintCapturePipeline's blueprint-contracts pin.
          ref: 7708a4e4c5dedeeb39cc73d3f6869304de295b81
          path: BlueprintContracts
          ssh-key: ${{ secrets.BLUEPRINT_CONTRACTS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify shared robot-eval job request contract
        run: npm run pipeline:robot-eval-contract:verify -- --contracts-module BlueprintContracts/js/robot-eval-job-request.mjs

      - name: Audit assets
        run: npm run audit:assets

      - name: Verify Firebase rules parity
        run: npm run rules:parity

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run check

      - name: Claims guard (public-claims truthfulness gate)
        run: npm run claims:guard

      - name: Verify shared doctrine blocks match the cross-repo lock
        run: npm run doctrine:verify

      - name: Upload claims-guard report
        if: ${{ always() && hashFiles('output/claims-guard/**') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: claims-guard-report
          path: output/claims-guard
          if-no-files-found: ignore
          retention-days: 7

      - name: Dependency security audit (production deps, fail on high+)
        # Audit the committed lock directly. `npm ci` has already proven the
        # install, while npm's retiring quick-audit endpoint can reject the
        # realized peer tree as "invalid" (HTTP 400) before returning any
        # advisories. Keep the high+ gate when the endpoint answers, but do not
        # let its retirement outage fail CI (and, with the CI-gated deploy,
        # block production); surface it as a warning instead.
        run: |
          set -o pipefail
          if out=$(timeout 360 npm audit --package-lock-only --omit=dev --audit-level=high 2>&1); then
            printf '%s\n' "$out"
          elif printf '%s\n' "$out" | grep -qE 'audit endpoint returned an error|being retired|Invalid package tree|Bad Request'; then
            printf '%s\n' "$out"
            echo "::warning::npm quick-audit endpoint unavailable (being retired); high+ advisory gate skipped for this run"
          else
            printf '%s\n' "$out"
            exit 1
          fi

  rules-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (Firestore/Storage emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Install dependencies
        run: npm ci

      - name: Run Firebase security-rules emulator suite
        run: npm run test:rules

  graphify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify setup reuse and recovery without network
        run: python3 -m unittest discover -s scripts/graphify -p 'test_*.py'

      - name: Verify fresh-session automatic setup and AST refresh
        run: bash scripts/graphify/run-webapp-architecture-pilot.sh --no-viz

      - name: Verify graph outputs and offline environment reuse
        run: |
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/graph.json
          PIP_NO_INDEX=1 python3 scripts/graphify/ensure-environment.py
          git diff --exit-code

  test:
    needs: release-scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run changed-file tests and required safety checks
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release/checks.mjs test

      - name: Verify tests did not mutate tracked files
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "::error::The test run modified tracked files. Tests must write generated artifacts to temp directories (see BLUEPRINT_CANONICAL_ARTIFACT_ROOT in client/tests/setup.ts)."
            git status --short
            git --no-pager diff --stat
            exit 1
          fi

      - name: Upload coverage
        if: ${{ hashFiles('coverage/**') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    needs: release-scope
    if: needs.release-scope.outputs.scope != 'content'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # All configured browser checks use Chromium. Bound installation so a
        # stalled runner fails with logs instead of holding the gate indefinitely.
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright install
        run: npx playwright install --dry-run chromium

      - name: Build stable browser-test client
        env:
          BLUEPRINT_ALLOW_UNCONFIGURED_CLIENT_BUILD: "1"
        run: npm run build

      - name: Build stable fake-auth browser-test client
        env:
          BLUEPRINT_E2E: "1"
          VITE_BLUEPRINT_OPERATOR_QA_FAKE_AUTH: "1"
          VITE_GA_MEASUREMENT_ID: "G-XXXXXXXXXX"
          VITE_FIREBASE_MEASUREMENT_ID: "G-XXXXXXXXXX"
        # Vite resolves CLI outDir from its client/ root.
        run: npx vite build --mode development --outDir ../dist/e2e-auth-public

      - name: Run E2E tests
        env:
          BLUEPRINT_E2E_STATIC: "1"
        run: npm run test:e2e

      - name: Run operator-surfaces QA (fake-auth bypass)
        env:
          BLUEPRINT_E2E_STATIC: "1"
        run: npm run qa:operator

      - name: Verify minimal site and robot-team workspaces
        run: npm run test:workspace:browser

      - name: Verify invited site beta journey with isolated fixture APIs
        run: npx playwright test --config playwright.invited-beta.config.ts

      - name: Verify private site links and retained capture handoff
        run: npm run test:site-reliability:browser

      - name: Upload Playwright report
        if: ${{ always() && hashFiles('playwright-report/**') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7


  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Compile-only: this build verifies the app compiles and is never
        # served, so it has no Firebase client config and does not need any.
        # A deploy build without it fails, which is the point of the guard.
        env:
          BLUEPRINT_ALLOW_UNCONFIGURED_CLIENT_BUILD: "1"
        run: npm run build

      - name: Run build-output tests
        run: npm run test:build-output

      - name: Run isolated local launch smoke
        run: npm run smoke:launch:local

      - name: Run agent contract drift guard
        run: npx vitest run scripts/agent-access/agent-access-drift-guard.test.ts

      - name: Upload build metadata
        if: ${{ always() && hashFiles('dist/public/version.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: dist/public/version.json
          if-no-files-found: ignore
          retention-days: 7

  deployment-admission:
    name: Observe automatic deployment admission
    needs: [check, rules-emulator, test, e2e, build]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Observe holds even when content-only browser checks were intentionally skipped.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The same repository/organization vars scope as Deploy, with no
      # environment, checkout, secrets, API requests or control mutations.
      # Retain only a fixed classification in the authenticated step identity;
      # an empty configured value is not absence and arbitrary values stay private.
      - name: Observe deployment admission in workflow context
        id: admission
        env:
          DEPLOYMENT_VARIABLE_CONTEXT: ${{ toJSON(vars) }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const raw = process.env.DEPLOYMENT_VARIABLE_CONTEXT;
          if (!raw || raw.length > 256_000) throw Error('deployment_context_unavailable');
          const context = JSON.parse(raw);
          if (!context || Array.isArray(context) || typeof context !== 'object') throw Error('deployment_context_unavailable');
          const name = 'BLUEPRINT_AUTOMATIC_DEPLOY_ENABLED';
          const gate = !Object.hasOwn(context, name) ? 'absent'
            : context[name] === 'false' ? 'literal_false' : 'blocked';
          appendFileSync(process.env.GITHUB_OUTPUT, `gate=${gate}\n`);
          NODE
      - name: "Confirm automatic deployment admission: ${{ steps.admission.outputs.gate }}"
        if: steps.admission.outputs.gate == 'absent' || steps.admission.outputs.gate == 'literal_false'
        run: echo 'The workflow context satisfies the held release predicate.'
