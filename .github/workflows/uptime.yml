name: Uptime

# Backstop uptime probe that runs OUTSIDE Render, so it still fires when Render
# itself, the service, or its own alerting is down.
#
# The every-10-minutes probe is the `blueprint-uptime-probe` Render cron job
# (render.yaml). GitHub throttles scheduled workflows under load (in practice
# this one ran every 2-5 hours, not every 10 minutes) and disables schedules on
# repositories with no activity for 60 days, so this schedule cannot be the
# primary monitor. Both run the same script, scripts/ops/uptime-probe.mjs:
# /health, /version.json and /health/worker (the background worker heartbeat).
# A failure fails the run (GitHub emails the repo owner on scheduled-run
# failure) and, when the SLACK_WEBHOOK_URL repository secret is set, posts to
# Slack. See docs/runbooks/beta-monitoring.md.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to probe"
        required: false
        default: "https://tryblueprint.io"

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ops
          persist-credentials: false

      - name: Probe /health, /version.json and /health/worker
        env:
          UPTIME_BASE_URL: ${{ github.event.inputs.base_url || 'https://tryblueprint.io' }}
          UPTIME_RETRY_DELAY_MS: "20000"
          UPTIME_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/ops/uptime-probe.mjs
